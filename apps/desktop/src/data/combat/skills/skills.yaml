# caeli: o elemento MAIS FRACO em potência e o MAIS BARATO em aprender — é de se esperar
#   que o vento e o ar não façam estrago. Personalidade: não bate forte, mas chega sempre,
#   empurra, cega, atrasa e sustenta. Os custos de aprendizagem são os mais baixos do
#   jogo (raízes a 50 XP, capstones a 1600-1800) e o dano nunca passa de 60.
#   3 raízes, todas de mana20:
#   puff (Ar)        = o ar como substância — comprimir, rarear, sugar, tirar o ar
#   gust (Vento)     = o ar em movimento — deslocar, empurrar, tempestades
#   thermal (Corrente) = ar quente — sustentação, mobilidade e suporte da equipa
# caeli ramificação:
#   Ar:        puff → breath, compressed_air_ball → dense_air → decompression
#              → vacuum → pressure_burst → airlock → last_breath;
#              puff → gas → toxic → tornado
#   Vento:     breeze (raiz, 4 de dano, custo zero) → wind (× fog, icy_wind,
#              thunder_tornado, gas_minion) → wind_steal, gust (rajada forte e súbita)
#              → squall → whirlwind, hurricane, fire_tornado (× fire_ball) → fire_wind
#              → smoke, sand_wind (× rock_shield) → sand_tornado;
#              squall → downburst → storm_front → gale_force
#   Corrente:  thermal → oxygen, updraft (× night: ghost_dash), wind_shield
#              → fly → soar → sky_lift → tailwind → trade_winds
# caeli encontros: hurricane (tornado + whirlwind), eye_of_the_storm (trade_winds +
#           downburst), ghost_dash (updraft + night), e os híbridos com ignis/lapis
