# Índice de skills (elemento → IDs):
# Bases por elemento (a árvore deriva-se dos pré-requisitos; personalidade onde há mais de uma):
# · aqua: water = pressão/sustentação | ice = controlo/resistência (debuff Slowed em quase todas)
# · corporis: kick = pernas | punch = punhos | bulck = condicionamento | headbutt = cabeça
# · lux: day (Day) = sustentação — cura, wards e buffs de equipa, pouco dano |
#        light (Light) = ofensiva — dano e debuffs ao inimigo, quase sem cura
# · caeli: o elemento mais FRACO em potência e o mais BARATO em aprender — o vento e o ar
#        não fazem estrago. 3 raízes: puff (Ar) | breeze (Vento) | thermal (Corrente)
# · chaos: corruption = raiz; a eletricidade (electric_* e thunder*) vive aqui, encaixada
#        na família da vibração (low_vibration → electric_shock → …)
# · florere: sprout = vida e crescimento | briar = a planta que se defende | spore = o wild
# · lapis: stone = pedra bruta | earth = o terreno vivo | crystal = pedra refinada
# · spatium: o elemento MAIS PODEROSO do jogo — custos e XP muito acima da média
#        3 raízes: blink (Espaço) | hasten (Tempo) | event_horizon (Gravidade)
# · umbra: night = ocultação, controlo e suporte | dark = fome e poder bruto
#        darkness é um ward mais profundo, já dentro de Night (não é uma raiz)
# · vis: mana05 é a raiz comum a todas as árvores; vetus: raízes puras (sem pré-requisitos)
# Regra: dentro de um elemento o XP sobe sempre ao longo das arestas (pré-requisitos cross-tree podem descer).
