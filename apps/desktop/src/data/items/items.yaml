# ═══════════════════════════════════════════════════════════════════
#  ITEMS  –  the single catalogue for the whole game
# ═══════════════════════════════════════════════════════════════════
#
#  One entry per item. Fields:
#    id                    stable id used by dialogues, loot, rewards and saves
#    name / description    display strings
#    category              consumable | throwable | buff | debuff | key_item
#    target                self | one_ally | one_enemy | all_allies |
#                          all_enemies | both_teams | dead_ally
#    effects               typed list (see below); empty for a key item
#    usable_in_combat      may the item be used during a fight
#    usable_outside_combat may the item be used outside a fight
#    consumed_on_use       is one unit spent when the item is used
#    max_stack             carry limit; null means unlimited
#
#  Effect types:
#    restore          resource (hp|mana|stamina) + amount (add amount_max for a range)
#    restore_percent  resource + amount_percent
#    damage           amount (+ element to scale the hit by the element matrix)
#    status           status_effect + effect_id + turns (+ damage for a per-turn DoT,
#                     buff/debuff stat deltas, element)
#    revive           amount_percent of the target's maximum HP
#    cleanse          removes every live status from the target
#    drain            amount + drain_percent healed back to the user
#    mystery          turns (random outcome)
#
#  An effect may override the item's `target` with its own `target`.
#
#  ── INDEX ──
#  potions     hp_potion hp_potion_plus mega_hp_potion team_hp_potion
#              mn_potion mn_potion_plus mega_mn_potion team_mn_potion
#              sn_potion sn_potion_plus mega_sn_potion
#              elixir mega_elixir team_elixir
#  throwables  fire_bomb ice_bomb wind_bomb earth_bomb
#              fire_bomb_plus ice_bomb_plus wind_bomb_plus
#              scatter_bomb fire_rain blizzard_flask thunder_jar
#              poison_vial acid_flask burning_oil
#  specials    phoenix_feather phoenix_plume miracle_feather
#              antidote team_antidote
#              life_dew moon_dew soul_siphon life_steal_orb
#              galatime_shard mirror_shard berserker_draught shadow_cloak
#              lucky_coin mystery_potion
#  buffs       power_tonic arcane_tonic iron_tonic ward_tonic speed_tonic
#              power_tonic_plus arcane_tonic_plus iron_tonic_plus
#              war_elixir fortress_elixir hero_elixir war_drum barrier_scroll
#  debuffs     weakness_powder mind_fog_dust rust_powder dispel_dust slow_trap
#              weakness_powder_plus rust_powder_plus
#              hex_bag curse_scroll smoke_bomb terror_mask mana_drain_dust
#  key items   pacci_keepsake

