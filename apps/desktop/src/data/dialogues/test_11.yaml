  fala_21:
    type: line
    speaker_id: alice
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: And because things have been like this, I want to ask you to do a couple of things for me.
    next: fala_22

  fala_22:
    type: line
    speaker_id: alice
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: One, keep this incident with the city's crystals a secret. We don't want people to get panicked.
    next: fala_23

  fala_23:
    type: line
    speaker_id: pacci
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: Right!
    next: fala_24

  fala_24:
    type: line
    speaker_id: alice
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: Second, increase security around the tunnels and other points of importance. We don't know if there's another "attack" planned.
    next: fala_25

  fala_25:
    type: line
    speaker_id: pacci
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: Right away!
    next: fala_26

  fala_26:
    type: line
    speaker_id: alice
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: "And finally, I want you to investigate the temple again, "
      - type: styled_text
        value: alone
        style:
          italic: true
      - type: text
        value: . Make sure that there are no more hidden passages or surprises.
