  fala_12:
    type: line
    speaker_id: alice
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Raphael is one of the most competent alchemists we have. He should be able to take care of her with no issue.
    next: fala_13

  fala_13:
    type: line
    speaker_id: alice
    emotion: annoyed
    animation_id: idle
    text:
      - type: text
        value: Although, if you ask me, he's not utilizing his capabilities to his full potential. I've asked him if he wanted to raise in the ranks multiple times, but he always refuses.
    next: fala_14

  fala_14:
    type: line
    speaker_id: pacci
    emotion: thinking
    animation_id: idle
    text:
      - type: text
        value: Yeah, I don't get it myself. I've heard the rumors that he has a ton of young alchemists trying to become his apprentices, but he just refuses all of them.
    next: fala_15

  fala_15:
    type: line
    speaker_id: alice
    emotion: thinking
    animation_id: idle
    text:
      - type: text
        value: Do you have any idea why he does that?
