  fala_19:
    type: line
    speaker_id: alice
    emotion: concerned
    animation_id: idle
    text:
      - type: text
        value: I'm concerned with the current state of affairs. Monster population rises as we speak. We found crystals in a temple that, by all means and purposes, should've been completely explored but wasn't. And now the mana in the air was being poisoned for of reasons we don't know.
