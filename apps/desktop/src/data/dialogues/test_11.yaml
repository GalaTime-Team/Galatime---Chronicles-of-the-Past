  fala_5:
    type: line
    speaker_id: pacci
    emotion: thinking
    animation_id: idle
    text:
      - type: text
        value: I see... That does make sense.
    next: fala_6

  fala_6:
    type: line
    speaker_id: pacci
    emotion: concerned
    animation_id: idle
    text:
      - type: text
        value: "Now what? Is she in the infirmary? "
    next: fala_7

  fala_7:
    type: line
    speaker_id: alice
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: According to Raphael's report, Kelly started bleeding heavily and collapsed on the floor. That's when the guards appeared and helped him take her to his house.
    next: fala_8

  fala_8:
    type: line
    speaker_id: pacci
    emotion: suspicious
    animation_id: idle
    text:
      - type: text
        value: To his house?
    next: fala_9

  fala_9:
    type: line
    speaker_id: alice
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Originally, the guards wanted to take her into HQ, but Raphael said that that it would be the first place the attacker would look. So he said that he would take care of her in his house.
    next: fala_10

  fala_10:
    type: line
    speaker_id: alice
    emotion: concerned
    animation_id: idle
    text:
      - type: text
        value: As much as I believe that It would be for the best for her to be on HQ, Raphael has a point.
    next: fala_11

  fala_11:
    type: line
    speaker_id: pacci
    emotion: concerned
    animation_id: idle
    text:
      - type: text
        value: Should we send a team of guards to Raphael's house? Maybe some of the medical staff?
