    emotion: suspicious
    animation_id: idle
    text:
      - type: text
        value: Raphael couldn't identify. Said that, while he was distracted with a sudden mutation of one of his catalysts, someone with incredible speed, stabbed her in the gut and then ran off. However, we suspect that it was someone who was hired by her superior.
