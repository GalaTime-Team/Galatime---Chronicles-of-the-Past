  fala_r3_16:
    type: line
    speaker_id: arthur
    emotion: annoyed
    animation_id: idle
    text:
      - type: text
        value: You can't be certain about it! Maybe they'll recognize me by instinct!
    next: fala_r3_17

  fala_r3_17:
    type: line
    speaker_id: raphael
    emotion: suspicious
    animation_id: idle
    text:
      - type: text
        value: Would they?
    next: fala_r3_18

  fala_r3_18:
    type: line
    speaker_id: arthur
    emotion: annoyed
    animation_id: idle
    text:
      - type: text
        value: What's that supposed to mean?
    next: fala_r3_19

  fala_r3_19:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: "Arthur, has "
      - type: styled_text
        value: any
        style:
          italic: true
      - type: text
        value: " slime attacked you?"
    next: fala_r3_20

  fala_r3_20:
    type: line
    speaker_id: arthur
    emotion: suspicious
    animation_id: idle
    text:
      - type: text
        value: ... Yeah, every single one...
    next: fala_r3_21

  fala_r3_21:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Exactly. But if slimes recognized each other by instinct, which they probably do, why would they attack you?
    next: fala_r3_22

  fala_r3_22:
    type: line
    speaker_id: arthur
    emotion: concerned
    animation_id: idle
    text:
      - type: text
        value: ...
    next: fala_r3_23

  fala_r3_23:
    type: line
    speaker_id: kelly
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: They don't recognize you as their own, idiot. Never would. So stop denying it, and accept what happened.
    next: fala_r3_24

  fala_r3_24:
    type: line
    speaker_id: kelly
    emotion: serious
    animation_id: idle
    text:
      - type: text
        value: It's getting way to sad seeing you trying to cling to the past.
    next: fala_r3_25

  fala_r3_25:
    type: line
    speaker_id: arthur
    emotion: frustrated
    animation_id: idle
    text:
      - type: text
        value: It's easy for you to say! You have a home and a family waiting for you! I've got nothing!
    next: fala_r3_26

  fala_r3_26:
    type: line
    speaker_id: arthur
    emotion: angry
    animation_id: idle
    text:
      - type: shout
        value: NOTHING, YOU HEAR ME!!
    next: fala_r3_27

  fala_r3_27:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: That's not true.
    next: fala_r3_28

  fala_r3_28:
    type: line
    speaker_id: arthur
    emotion: annoyed
    animation_id: idle
    text:
      - type: text
        value: What do you mean?
    next: fala_r3_29

  fala_r3_29:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: When Pacci took you in, he offered you to stay for as long as you needed.
    next: fala_r3_30

  fala_r3_30:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: In the few days that you've been with us, not only have you made friends with Duha and the others, but you also helped us save the city.
    next: acao_3

  acao_3:
    type: character_action
    character_id: raphael
    position: right
    depth: back
    animation_id: step_across
    next: fala_r3_31

  fala_r3_31:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: "*Puts hand on shoulder*"
    next: fala_r3_32

  fala_r3_32:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: "Maybe you don't have much a past, but you "
      - type: styled_text
        value: do
        style:
          bold: true
      - type: text
        value: " have a present. And if you work on it, you'll have a bright future ahead."
    next: fala_r3_33

  fala_r3_33:
    type: line
    speaker_id: arthur
    emotion: unsure
    animation_id: idle
    text:
      - type: text
        value: Are you sure?
    next: fala_r3_34

  fala_r3_34:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Positive. So cheer up, boy.
    next: fala_r3_35

  fala_r3_35:
    type: line
    speaker_id: arthur
    emotion: happy
    animation_id: idle
    text:
      - type: text
        value: Thanks Raphael.
    next: fala_r3_36

  fala_r3_36:
    type: line
    speaker_id: raphael
    emotion: happy
    animation_id: idle
    text:
      - type: text
        value: You're welcome. Now, why don't you go upstairs and let me ask Kelly a few questions.
    next: fala_r3_37

  fala_r3_37:
    type: line
    speaker_id: arthur
    emotion: happy
    animation_id: idle
    text:
      - type: text
        value: Okay.
    next: ramificacao_2

  ramificacao_2:
    type: conditional
    branches:
      - branch_id: ramo_1
        if:
          all:
            - condition: equals
              left: flags.curious_stab
              right: false
        next: fim_good
      - branch_id: ramo_2
        if:
          all:
            - condition: equals
              left: flags.curious_stab
              right: true
        next: acao_4
      - branch_id: ramo_3
        next: fim_error

  acao_4:
    type: character_action
    character_id: arthur
    position: center_left
    animation_id: step_across
    next: fala_55

  fala_55:
    type: line
    speaker_id: arthur
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Actually, can I ask a question before I go?
    next: fala_56

  fala_56:
    type: line
    speaker_id: raphael
    emotion: happy
    animation_id: idle
    text:
      - type: text
        value: Ahaha. You already did.
    next: fala_57

  fala_57:
    type: line
    speaker_id: arthur
    emotion: happy
    animation_id: idle
    text:
      - type: text
        value: Y-yeah.
    next: fala_58

  fala_58:
    type: line
    speaker_id: arthur
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Anyway. What was that thing about Kelly getting stabbed?
    next: fala_59

  fala_59:
    type: line
    speaker_id: raphael
    emotion: nervous
    animation_id: idle
    text:
      - type: text
        value: Uh... Well.
    next: fala_60

  fala_60:
    type: line
    speaker_id: kelly
    emotion: angry
    animation_id: idle
    text:
      - type: text
        value: "This absolute buffoon stabbed me before handing me to the authorities, "
      - type: shout
        value: that's what happened!
    next: fala_61

  fala_61:
    type: line
    speaker_id: arthur
    emotion: surprised
    animation_id: idle
    auto_advance: true
    text:
      - type: text
        value: What the-
    next: fala_62

  fala_62:
    type: line
    speaker_id: raphael
    emotion: nervous
    animation_id: idle
    text:
      - type: text
        value: Look, I know it sounds bad.
    next: fala_63

  fala_63:
    type: line
    speaker_id: kelly
    emotion: angry
    animation_id: idle
    text:
      - type: shout
        value: IT SOUNDS!?
    next: fala_64

  fala_64:
    type: line
    speaker_id: raphael
    emotion: stressed
    animation_id: idle
    text:
      - type: text
        value: But, it was all part of the plan!
    next: fala_65

  fala_65:
    type: line
    speaker_id: arthur
    emotion: surprised
    animation_id: idle
    text:
      - type: shout
        value: WHAT PLAN!?
    next: fala_66

  fala_66:
    type: line
    speaker_id: raphael
    emotion: nervous
    animation_id: idle
    text:
      - type: text
        value: The plan that is finding out what those files were about.
    next: fala_67

  fala_67:
    type: line
    speaker_id: kelly
    emotion: angry
    animation_id: idle
    text:
      - type: text
        value: "... You stabbed me, just so you could "
      - type: styled_text
        value: interrogate me!
        style:
          bold: true
    next: fala_68

  fala_68:
    type: line
    speaker_id: arthur
    emotion: nervous
    animation_id: idle
    text:
      - type: text
        value: Isn't that illegal?
    next: fala_69

  fala_69:
    type: line
    speaker_id: raphael
    emotion: annoyed
    animation_id: idle
    text:
      - type: text
        value: Wasn't the whole "poison the mana in the air" illegal too?
    next: fala_70

  fala_70:
    type: line
    speaker_id: kelly
    emotion: angry
    animation_id: idle
    text:
      - type: text
        value: When I get out of these restraints, you're so f#$%@=g dead.
    next: fala_71

  fala_71:
    type: line
    speaker_id: arthur
    emotion: nervous
    animation_id: idle
    delivery: thought
    text:
      - type: text
        value: He kinda has a point though.
    next: fala_72

  fala_72:
    type: line
    speaker_id: raphael
    emotion: neutral
    animation_id: idle
    text:
      - type: text
        value: Right, whatever you say, Kelly. Arthur, please keep this whole "stabbing" thing between us. I want to be a good example to Pacci and Neven.
    next: fala_73

  fala_73:
    type: line
    speaker_id: arthur
    emotion: nervous
    animation_id: idle
    text:
      - type: text
        value: ... Sure.
    next: fim_good

  fim_good:
    type: end
    result: good

  fim_error:
    type: end
    result: bad
