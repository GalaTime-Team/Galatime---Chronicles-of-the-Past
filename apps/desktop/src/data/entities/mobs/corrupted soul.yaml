id: corrupted_soul
name: Corrupted Soul
rarity: epic
height: "140 cm"
weight: "0 kg"
description: >
  A soul consumed by endless avarice. Its touch withers resolve, and
  its hunger feeds on any fading spark nearby.

elements:
  - umbra

base_stats:
  hp: 500
  mana: 85
  stamina: 30
  physical_attack: 28
  magical_attack: 72
  physical_defense: 46
  magical_defense: 38
  speed: 47

skills:
  - abyssal_drain
  - corruptive_wail
  - desolate_claw

loot:
  - item_id: gold_coin
    quantity: 3
    chance: 0.65

abilities:
  - ability_name: Nether Armor
    condition:
      type: on_low_resource
      resource: hp
      threshold: 0.4
    action:
      type: immunity
      damage_type: magical
      duration: 2
    keep_triggered_after_once: false
    activation_message: "A nether veil shields the Corrupted Soul from magic!"

  - ability_name: Twisted Reflection
    condition:
      type: on_turn
      interval: 3
      timing: post_action
      require_battle_continues: true
    action:
      type: change_state
      new_template: pure_soul
    keep_triggered_after_once: false
    activation_message: "The Corrupted Soul's corruption shifts, briefly revealing purity."

