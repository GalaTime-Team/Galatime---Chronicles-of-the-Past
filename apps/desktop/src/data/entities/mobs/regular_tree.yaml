id: regular_tree
name: Regular Tree
rarity: uncommon
height: "280 cm"
weight: "420 kg"
description: >
  There is nothing regular about this tree. Beside it moving,
  it throws explosive apples, and summons flowerlings to fight...
  I will give it credit, it has some sick moves.

elements:
  - florere
  - chaos

base_stats:
  hp: 736
  mana: 22
  stamina: 39
  physical_attack: 43
  magical_attack: 24
  physical_defense: 55
  magical_defense: 31
  speed: 8

skills:
  - explosive_apples
  - apple_party

weapon: 

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: sweet_pollen
    quantity: 1
    chance: 0.45

abilities:
  - id: seed_flowerling
    name: Seed Flowerling
    description: After 3 of its turns, it grows a Flowerling.
    tags: [summon]
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 3
    action:
      type: summon
      target: self
      parameters:
        entity_id: flowerling
        entity_type: mob
        count: 1
    display:
      visible: true
      priority: 60

ai:
  style: brute
  weights:
    reposition: 0.0
  pace: 1000