id: greedy_soul
name: Greedy Soul
rarity: uncommon
height: "120 cm"
weight: "0 kg"
description: >
  Hollow absorvants of light souls that wander around, draining
  the life force of others. I hope these things aren't actual
  souls...

elements:
  - umbra

base_stats:
  hp: 250
  mana: 40
  stamina: 18
  physical_attack: 14
  magical_attack: 42
  physical_defense: 28
  magical_defense: 18
  speed: 38

skills:
  - soul_drain

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Charitable Soul.
    tags: [transform, cycle]
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: charitable_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]
